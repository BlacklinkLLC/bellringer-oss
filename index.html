<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BellRinger Open</title>

<link rel="stylesheet" href="src/style.css">
</head>

<body>

<header>
<div class="brand">
<img id="icon-brand" class="icon" alt="" width="22" height="22">
<div>
<span class="eyebrow">BELLRINGER OPEN</span>
<h1 id="school-name">Loading...</h1>
</div>
</div>

<div id="clock"></div>
</header>

<main>

<section class="current-period">

<span class="eyebrow">
<img id="icon-bell" class="icon" alt="" width="13" height="13">
                CURRENT PERIOD
</span>

<h2 id="current-period">
                Loading...
</h2>

<p id="current-time"></p>

<div
id="progress-container"
class="progress-container"
>
<div id="progress"></div>
</div>

<span id="progress-text">
                0%
</span>

</section>

<div class="content">

<section class="panel">

<h3>Today's Schedule</h3>

<div id="schedule">
                    Loading...
</div>

</section>

<section
id="announcements-panel"
class="panel"
>

<h3>
<img id="icon-announcement" class="icon" alt="" width="16" height="16">
Announcements
</h3>

<div id="announcements">
                    Loading...
</div>

</section>

</div>

</main>

<footer>
        BellRinger Open Source · © 2026 Blacklink, Inc.
</footer>

<script src="src/app.js"></script>
<script type="module">
    import { icons } from 'https://cdn.blacklink.net/blacklink-icons.js';

    document.getElementById('icon-brand').src = icons.BellRinger;
    document.getElementById('icon-bell').src = icons.Bell;
    document.getElementById('icon-announcement').src = icons.Announcement;
</script>

</body>
</html>
