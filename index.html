<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BellRinger Open</title>

    <link rel="stylesheet" href="src/style.css">
</head>

<body>

    <header>
        <div>
            <span class="eyebrow">BELLRINGER OPEN</span>
            <h1 id="school-name">Loading...</h1>
        </div>

        <div id="clock"></div>
    </header>

    <main>

        <section class="current-period">

            <span class="eyebrow">
                CURRENT PERIOD
            </span>

            <h2 id="current-period">
                Loading...
            </h2>

            <p id="current-time"></p>

            <div
                id="progress-container"
                class="progress-container"
            >
                <div id="progress"></div>
            </div>

            <span id="progress-text">
                0%
            </span>

        </section>

        <div class="content">

            <section class="panel">

                <h3>Today's Schedule</h3>

                <div id="schedule">
                    Loading...
                </div>

            </section>

            <section
                id="announcements-panel"
                class="panel"
            >

                <h3>Announcements</h3>

                <div id="announcements">
                    Loading...
                </div>

            </section>

        </div>

    </main>

    <footer>
        BellRinger Open Source · © 2026 Blacklink, Inc.
    </footer>

    <script src="src/app.js"></script>

</body>
</html>
