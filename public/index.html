<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BellRinger Open</title>
<meta name="description" content="A small, self-hosted school schedule dashboard.">
<meta name="theme-color" content="#0a0a10">

<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.blacklink.net; style-src 'self' https://nova.blacklink.net; img-src 'self' data: https://cdn.blacklink.net; connect-src 'self' https://cdn.blacklink.net https://nova.blacklink.net; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<!-- NOVA design system (https://nova.blacklink.net): class-scoped component CSS only.
     Not nova-main.css / nova.css, which include a global page reset. See nova-bridge.css. -->
<link rel="stylesheet" href="https://nova.blacklink.net/new-nova/src/buttons.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://nova.blacklink.net/new-nova/src/forms.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://nova.blacklink.net/new-nova/src/toggles.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://nova.blacklink.net/new-nova/src/badges-chips.css" crossorigin="anonymous">
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/themes.css">
<link rel="stylesheet" href="/src/styles/nova-bridge.css">
<link rel="stylesheet" href="/src/styles/layout.css">
<link rel="stylesheet" href="/src/styles/components/clock.css">
<link rel="stylesheet" href="/src/styles/components/status.css">
<link rel="stylesheet" href="/src/styles/components/hero.css">
<link rel="stylesheet" href="/src/styles/components/schedule.css">
<link rel="stylesheet" href="/src/styles/components/announcements.css">
<link rel="stylesheet" href="/src/styles/components/icons.css">
<link rel="stylesheet" href="/src/styles/components/widgets.css">
<link rel="stylesheet" href="/src/styles/components/customize.css">
<link rel="stylesheet" href="/src/styles/components/display-mode.css">
</head>

<body>

<header class="site-header">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="brand">
    <svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3a5.5 5.5 0 0 0-5.5 5.5V11c0 1.5-.8 2.5-1.8 3.5-.4.4-.2 1 .3 1h13c.5 0 .7-.6.3-1-1-1-1.8-2-1.8-3.5V8.5A5.5 5.5 0 0 0 12 3Z" fill="currentColor"/>
      <path d="M9.5 17a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div class="brand-text">
      <span class="eyebrow">BELLRINGER OPEN</span>
      <h1 id="school-name">Loading&hellip;</h1>
      <span id="school-district" class="brand-district" hidden></span>
    </div>
  </div>

  <div class="header-right">
    <button id="customize-button" class="btn btn-subtle customize-button" type="button" hidden>
      Customize
    </button>
    <span id="status-badge" class="status-badge" hidden>
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text"></span>
    </span>
    <time id="date" class="header-date"></time>
    <time id="clock" class="header-clock" role="timer" aria-live="off"></time>
  </div>
</header>

<main id="main-content" class="site-main" tabindex="-1">

  <!-- Widgets are built here from the layout (see src/widgets). -->
  <div id="widget-grid" class="widget-grid"></div>

</main>

<footer class="site-footer">
  <span>
    BellRinger Open Source &middot; &copy; 2026 Blacklink, Inc. &middot;
    <a href="https://nova.blacklink.net" rel="noopener">NOVA UI by Blacklink Education &copy;2026</a>
  </span>
  <a href="?mode=display">Display Mode</a>
</footer>

<div id="aria-status" class="sr-only" role="status" aria-live="polite"></div>

<noscript>
  <div class="panel no-script-panel">
    <h2>JavaScript is required</h2>
    <p>BellRinger Open is a small JavaScript application. Enable JavaScript to view the schedule.</p>
  </div>
</noscript>

<script type="module" src="/src/app.js"></script>
</body>
</html>
