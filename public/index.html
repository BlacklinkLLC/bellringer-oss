<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BellRinger Open</title>
<meta name="description" content="A small, self-hosted school schedule dashboard.">
<meta name="theme-color" content="#0a0a10">

<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'">

<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/themes.css">
<link rel="stylesheet" href="/src/styles/layout.css">
<link rel="stylesheet" href="/src/styles/components/clock.css">
<link rel="stylesheet" href="/src/styles/components/status.css">
<link rel="stylesheet" href="/src/styles/components/hero.css">
<link rel="stylesheet" href="/src/styles/components/schedule.css">
<link rel="stylesheet" href="/src/styles/components/announcements.css">
<link rel="stylesheet" href="/src/styles/components/display-mode.css">
</head>

<body>

<header class="site-header">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="brand">
    <svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3a5.5 5.5 0 0 0-5.5 5.5V11c0 1.5-.8 2.5-1.8 3.5-.4.4-.2 1 .3 1h13c.5 0 .7-.6.3-1-1-1-1.8-2-1.8-3.5V8.5A5.5 5.5 0 0 0 12 3Z" fill="currentColor"/>
      <path d="M9.5 17a2.5 2.5 0 0 0 5 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div class="brand-text">
      <span class="eyebrow">BELLRINGER OPEN</span>
      <h1 id="school-name">Loading&hellip;</h1>
      <span id="school-district" class="brand-district" hidden></span>
    </div>
  </div>

  <div class="header-right">
    <span id="status-badge" class="status-badge" hidden>
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-text"></span>
    </span>
    <time id="date" class="header-date"></time>
    <time id="clock" class="header-clock" role="timer" aria-live="off"></time>
  </div>
</header>

<main id="main-content" class="site-main" tabindex="-1">

  <section class="hero" aria-labelledby="current-period-heading">
    <div class="hero-top">
      <span class="eyebrow">RIGHT NOW</span>
    </div>

    <h2 id="current-period" class="current-period-title">Loading&hellip;</h2>
    <p id="current-range" class="current-range" aria-hidden="true"></p>

    <div id="progress-block" class="progress-block" hidden>
      <div id="progress-bar" class="progress-bar"
           role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" aria-label="Time remaining in the current period">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="progress-meta">
        <span id="progress-elapsed"></span>
        <span id="progress-percent"></span>
        <span id="progress-remaining"></span>
      </div>
    </div>

    <div id="next-period" class="next-period" hidden>
      <span class="next-label">Next</span>
      <strong id="next-name"></strong>
      <span id="next-start" class="next-start"></span>
      <span id="next-countdown" class="next-countdown" hidden></span>
    </div>
  </section>

  <div class="content">

    <section id="schedule-panel" class="panel schedule-panel" aria-labelledby="schedule-title">
      <h3 id="schedule-title">Today's Schedule</h3>
      <ul id="schedule" class="schedule-list"></ul>
    </section>

    <section id="announcements-panel" class="panel announcements-panel" aria-labelledby="announcements-title">
      <h3 id="announcements-title">
        <svg class="panel-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 10v4c0 .6.4 1 1 1h1v4h2v-4h3l5 4V6l-5 4H4c-.6 0-1 .4-1 1Zm16 2 3 3h-2l-3-3 3-3h2l-3 3Z" fill="currentColor"/>
        </svg>
        Announcements
      </h3>
      <div id="announcements" class="announcements"></div>
    </section>

  </div>

</main>

<footer class="site-footer">
  <span>BellRinger Open Source &middot; &copy; 2026 Blacklink, Inc.</span>
  <a href="?mode=display">Display Mode</a>
</footer>

<div id="aria-status" class="sr-only" role="status" aria-live="polite"></div>

<noscript>
  <div class="panel no-script-panel">
    <h2>JavaScript is required</h2>
    <p>BellRinger Open is a small JavaScript application. Enable JavaScript to view the schedule.</p>
  </div>
</noscript>

<script type="module" src="/src/app.js"></script>
</body>
</html>
